<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de arquitecturas · Impulsa Digital</title>
<meta name="description" content="Simulador que compara tres arquitecturas de backend para Impulsa Digital con un modelo de cálculo explicable. Los resultados son estimaciones del modelo, no mediciones.">
<meta name="theme-color" content="#414874" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1226" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23414874'/%3E%3Cpath d='M8 22l5-6 4 3 7-9' stroke='%23F2B33D' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<script>
  /* Aplica el tema guardado antes de pintar, para evitar un destello. */
  try {
    var t = window.localStorage.getItem('impulsa-sim-tema');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (err) { /* sin almacenamiento: se usa el tema del sistema */ }
</script>
</head>
<body>
<a class="saltar" href="#app">Saltar al contenido</a>

<div class="pagina">
  <header class="cab-sitio">
    <h1>Simulador de arquitecturas</h1>
    <div class="cab-der">
      <p class="aviso" title="Los resultados son estimaciones del modelo, no mediciones reales de rendimiento."><span class="i" aria-hidden="true">ⓘ</span><span>Estimaciones del modelo, no mediciones</span></p>
      <button type="button" class="tema-btn" id="btn-tema" aria-label="Cambiar a modo oscuro">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path class="i-luna" d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/><g class="i-sol" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      </button>
    </div>
  </header>

  <div class="barra" id="barra">
    <nav class="tabs" id="tabs" aria-label="Pasos del simulador"></nav>
    <div class="barra-estado" id="estado-global" aria-live="polite"></div>
  </div>

  <main id="app" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript><p class="sin-js">Este simulador necesita JavaScript para calcular los resultados. Actívalo en tu navegador y recarga la página.</p></noscript>

<script src="datos.js"></script>
<script src="modelo.js"></script>
<script src="estado.js"></script>
<script src="ui.js"></script>
<script src="ui-config.js"></script>
<script src="ui-alternativas.js"></script>
<script src="ui-simulador.js"></script>
<script src="graficos.js"></script>
<script src="ui-paneles.js"></script>
<script src="ui-modelo.js"></script>
<script>window.UI.iniciar();</script>
</body>
</html>
